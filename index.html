<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JP Tech Solutions - Iniciar Sesión</title>
    <link rel="stylesheet" href="public/css/styles.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>JP <span>Tech Solutions</span></h2>
        <p>Ingresa tus credenciales de acceso</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="12345" required>
            </div>
            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que el formulario recargue la página o busque rutas de servidor
            window.location.href = 'dashboard.html'; // Redirige exactamente a dashboard.html en la misma carpeta
        });
    </script>
</body>
</html>
